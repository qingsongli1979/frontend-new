<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IPv6 Log Viewer</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--page-bg, #f5f5f5);
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.04);
    }

    th,
    td {
      padding: 0.6rem 0.8rem;
      border: 1px solid #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: #262626;
      color: #fff;
      position: sticky;
      top: 0;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    tr.active {
      background: #d1ffd1 !important;
    }

    .loading,
    .error {
      text-align: center;
      font-size: 1.1rem;
      padding: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      body {
        --page-bg: #1e1e1e;
        color: #e4e4e4;
      }

      table {
        background: #282828;
      }

      th {
        background: #141414;
      }

      th,
      td {
        border-color: #444;
      }

      tr:nth-child(even) {
        background: #303030;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>IPv6 Log Viewer</h1>

    <div id="feedback" class="loading">Loading data…</div>

    <table id="logTable" hidden>
      <thead>
        <tr>
          <th style="width: 32%">Subnet</th>
          <th style="width: 10%">Server</th>
          <th style="width: 20%">Banned&nbsp;At</th>
          <th style="width: 20%">OK&nbsp;At</th>
          <th style="width: 10%">Score29</th>
          <th style="width: 8%">Active</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script>
    (() => {
      const FEED_URL =
        "https://console.123proxy.cn/ip/cookiesettings/noauth/ipv6log";
      const feedback = document.getElementById("feedback");
      const table = document.getElementById("logTable");
      const tbody = table.querySelector("tbody");

      /** Convert epoch‑ms (or seconds) to human‑readable string */
      const toDate = (ts) => {
        const n = Number(ts);
        if (!n) return "–";
        const d = new Date(n);
        // If year is 1970 maybe timestamp was seconds
        if (d.getFullYear() < 1971) return new Date(n * 1000).toLocaleString();
        return d.toLocaleString();
      };

      /** Build <tr> element from object */
      const buildRow = ({ subnet, serverId, banTimestamp, okTimestamp, active, score29 }) => {
        const isActive = active === true || active === "true";
        const tr = document.createElement("tr");
        if (isActive) tr.classList.add("active");
        tr.innerHTML = `
            <td title="${subnet}">${subnet}</td>
            <td>${serverId}</td>
            <td>${toDate(banTimestamp)}</td>
            <td>${toDate(okTimestamp)}</td>
            <td>${score29 !== undefined ? score29 : ""}</td>
            <td style="text-align:center">${isActive ? "✓" : "✗"}</td>
          `;
        return tr;
      };

      const load = async () => {
        try {
          const res = await fetch(FEED_URL);
          if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
          const raw = await res.text();
          const trimmed = raw.trim();
          const items = [];

          if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
            // JSON array or object
            const data = JSON.parse(trimmed);
            const arr = Array.isArray(data)
              ? data
              : data.List || data.items || data;
            if (!Array.isArray(arr)) throw new Error("Unexpected JSON structure");
            items.push(...arr);
          } else {
            // Assume XML
            const parser = new DOMParser();
            const xml = parser.parseFromString(raw, "application/xml");

            if (xml.querySelector("parsererror")) {
              throw new Error("Feed is not valid XML.");
            }

            const xpath = "//*[local-name()='item']";
            const snapshot = xml.evaluate(
              xpath,
              xml,
              null,
              XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
              null
            );
            if (snapshot.snapshotLength === 0) {
              throw new Error("Couldn't find <item> elements in XML feed.");
            }

            for (let i = 0; i < snapshot.snapshotLength; i++) {
              const node = snapshot.snapshotItem(i);
              items.push({
                subnet: node.querySelector("subnet")?.textContent.trim(),
                serverId: node.querySelector("serverId")?.textContent.trim(),
                banTimestamp: node.querySelector("banTimestamp")?.textContent.trim(),
                okTimestamp: node.querySelector("okTimestamp")?.textContent.trim(),
                active: node.querySelector("active")?.textContent.trim(),
                score29: node.querySelector("score29")?.textContent.trim(),
              });
            }
          }

          // Sort logic: serverId ASC -> Active ASC (inactive first, by banTimestamp) -> Active (by score29 DESC)
          items.sort((a, b) => {
            // 1. ServerID
            if (a.serverId < b.serverId) return -1;
            if (a.serverId > b.serverId) return 1;

            // 2. Active status (Inactive first)
            const aActive = a.active === true || a.active === "true";
            const bActive = b.active === true || b.active === "true";
            if (aActive !== bActive) {
              return aActive ? 1 : -1;
            }

            // 3. Different sorting based on status
            if (!aActive) {
              // Inactive: sort by banTimestamp DESC (latest ban first)
              const aBan = Number(a.banTimestamp) || 0;
              const bBan = Number(b.banTimestamp) || 0;
              return bBan - aBan;
            } else {
              // Active: sort with score29 DESC
              const aScore = parseFloat(a.score29) || 0;
              const bScore = parseFloat(b.score29) || 0;
              return bScore - aScore;
            }
          });

          // Render
          items.forEach((obj) => tbody.appendChild(buildRow(obj)));

          feedback.remove();
          table.hidden = false;
        } catch (err) {
          console.error(err);
          feedback.className = "error";
          feedback.textContent = `❌ Cannot display data: ${err.message}`;
        }
      };

      // In file:// context, CORS is likely blocked – advise user to run local server
      if (location.protocol === "file:") {
        load().catch(() => {
          feedback.className = "error";
          feedback.innerHTML =
            "❌ Could not fetch feed due to CORS.<br>" +
            "Run a local web server (e.g. <code>npx serve</code> or <code>python -m http.server</code>) and open via http://localhost.";
        });
      } else {
        load();
      }
    })();
  </script>
</body>

</html>
