<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>用户订单列表</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
        }
        form {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="text"] {
            font-size: 1rem;
            padding: 0.5em;
            width: 70%;
            max-width: 300px;
            box-sizing: border-box;
            text-align: center;
        }
        select {
            font-size: 1rem;
            padding: 0.5em;
            width: 70%;
            max-width: 300px;
            box-sizing: border-box;
            text-align: center;

        }
        button {
            font-size: 1rem;
            padding: 0.6em 1em;
            margin-left: 0.5em;
            cursor: pointer;
        }
        /* responsive table container */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 auto;
            max-width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.5em;
            text-align: center;
        }
        th {
            background: #f5f5f5;
        }
        @media (max-width: 600px) {
            th, td {
                font-size: 0.85rem;
                padding: 0.4em;
            }
        }
    </style>
</head>
<body>

<h1>用户订单列表</h1>

<form id="orderForm">
    <label for="username">代理用户名:</label>
    <input type="text" id="username" name="username" placeholder="输入用户名">

    <button type="button" id="copyButton" style="cursor: pointer;height: 48px" onclick="copyUsernameToClipboard(this)" >粘贴</button>

    <br>
    <label for="username">续费金额:</label>
    <input type="text" id="num" name="num" placeholder="续费金额">

    <br>
    <button type="button" id="bankinsert">用户充值</button>




</form>

<div id="result">
    <!-- 订单表格会渲染到这里 -->
</div>

<!-- jQuery（若已在项目中，请改用全局引用） -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>

<script>
    // 从页面 URL 拿 token，比如 ?token=ABC123
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';



    document.getElementById('bankinsert').addEventListener('click',  async (event) => {
        event.preventDefault();

        const endpoint = 'https://console.123proxy.cn/accsrv/adm/bankinsert';

        let username = document.getElementById('username').value.trim();
        if (!username) {
            alert('请先输入用户名');
            return;
        }
        if (!username.startsWith('u')) {
            username = 'u' + username;
        }

        let num = document.getElementById('num').value.trim();
        if (!num) {
            alert('请先输入续费金额');
            return;
        }


        const url = `${endpoint}?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}&amount=${num}`;
        try {
            const data = await $.getJSON(url);
            document.getElementById('result').innerHTML = `<p style="color:blue;">${data}</p>`;
        } catch (err) {
            console.error(err);
            document.getElementById('result').innerHTML = '<p style="color:red;">续费套餐失败，请稍后重试。</p>';
        }

    });





    function copyUsernameToClipboard(button) {
        const usernameElement = document.getElementById('username');

        navigator.clipboard.readText().then(text => {
            document.getElementById('username').value = text;
        }).catch(err => {
            console.error('Failed to read clipboard contents: ', err);
        });
    }



</script>
</body>
</html>
