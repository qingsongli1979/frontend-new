<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IP质量检测</title>
  <style>
    /* CSS style to make the windowId input bigger */
    #windowId {
      font-size: 30px; /* Adjust the font size as per your preference */
      text-align: center; /* Center the text in the input field */
    }
    #username {
      font-size: 20px; /* Adjust the font size as per your preference */
      text-align: center; /* Center the text in the input field */
    }
  </style>
</head>
<body>
<h1>IP质量自动检测</h1>

<!-- Add the "窗口ID" item -->

<form id="ipQualityForm">

  <label >代理用户名:</label>
  <div>
    <input type="text" id="username" name="username" size="50" style="height: 48px" >
    <button type="button" id="copyButton" style="cursor: pointer;height: 48px" onclick="copyUsernameToClipboard(this)" >粘贴</button>
  </div><br><br>


  <input type="button" value="开始流量" id="submitButton" style="height: 48px;" >
  <input type="button" value="开始2动态" id="submitButton1" style="height: 48px;" >
  <input type="button" value="开始3并发" id="submitButton2" style="height: 48px;" >

  <input type="button" value="暂停套餐" id="submitButton3" style="height: 48px;" >
  <input type="button" value="取消暂停" id="submitButton4" style="height: 48px;" >
</form>

<div id="result">
  <!-- The IP address, country, region, and score will be displayed here -->
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token') || '';   // you could default to '' or some sentinel

  // JavaScript code to handle the form submission
  document.getElementById('submitButton').addEventListener('click',  async (event) => {
    event.preventDefault();
    await send(); // Wait before retrying
  });

  document.getElementById('submitButton1').addEventListener('click',  async (event) => {
    event.preventDefault();
    await send1(); // Wait before retrying
  });

  document.getElementById('submitButton2').addEventListener('click',  async (event) => {
    event.preventDefault();
    await send2(); // Wait before retrying
  });

  document.getElementById('submitButton3').addEventListener('click',  async (event) => {
    event.preventDefault();
    await freeze(); // Wait before retrying
  });

  document.getElementById('submitButton4').addEventListener('click',  async (event) => {
    event.preventDefault();
    await unfreeze(); // Wait before retrying
  });
  async function send() {
    let username = document.getElementById('username').value;
    if (!username.startsWith('u')) {
      username = 'u' + username;
    }
    const resultDiv = document.getElementById('result');

    const targetUrl =`https://console.123proxy.cn/ip/default/sendtraffic?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}`;
    console.log(targetUrl);

    try {
      const data = await $.get(targetUrl);
      console.log(data);
      resultDiv.innerHTML = data;
    } catch (error) {
    }


  }

  async function send1() {
    let username = document.getElementById('username').value;
    if (!username.startsWith('u')) {
      username = 'u' + username;
    }
    const resultDiv = document.getElementById('result');

    const targetUrl =`https://console.123proxy.cn/ip/default/sendtraffic2?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}`;
    console.log(targetUrl);

    try {
      const data = await $.get(targetUrl);
      console.log(data);
      resultDiv.innerHTML = data;
    } catch (error) {
    }


  }


  async function send2() {
    let username = document.getElementById('username').value;
    if (!username.startsWith('u')) {
      username = 'u' + username;
    }
    const resultDiv = document.getElementById('result');

    const targetUrl =`https://console.123proxy.cn/ip/default/sendtraffic3?token=${encodeURIComponent(token)}&username=${encodeURIComponent(username)}`;
    console.log(targetUrl);

    try {
      const data = await $.get(targetUrl);
      console.log(data);
      resultDiv.innerHTML = data;
    } catch (error) {
    }


  }




  async function freeze() {
    let username = document.getElementById('username').value;
    if (!username.startsWith('u')) {
      username = 'u' + username;
    }
    const resultDiv = document.getElementById('result');

    const targetUrl =`https://console.123proxy.cn/ip/default/freeze?token=${encodeURIComponent(token)}&freeze=true&username=${encodeURIComponent(username)}`;
    console.log(targetUrl);

    try {
      const data = await $.get(targetUrl);
      console.log(data);
      resultDiv.innerHTML = data;
    } catch (error) {
    }

  }


  async function unfreeze() {
    let username = document.getElementById('username').value;
    if (!username.startsWith('u')) {
      username = 'u' + username;
    }
    const resultDiv = document.getElementById('result');

    const targetUrl =`https://console.123proxy.cn/ip/default/freeze?token=${encodeURIComponent(token)}&freeze=false&username=${encodeURIComponent(username)}`;
    console.log(targetUrl);

    try {
      const data = await $.get(targetUrl);
      console.log(data);
      resultDiv.innerHTML = data;
    } catch (error) {
    }

  }


  function copyUsernameToClipboard(button) {
    const usernameElement = document.getElementById('username');

    navigator.clipboard.readText().then(text => {
      document.getElementById('username').value = text;
    }).catch(err => {
      console.error('Failed to read clipboard contents: ', err);
    });
  }
</script>
</body>
</html>
