user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 20m;

    resolver 127.0.0.11 ipv6=off valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    map $http_origin $console_cors_origin {
        default "";
        "https://www.123proxy.cn" $http_origin;
        "https://123proxy.cn" $http_origin;
    }

    map $http_origin $console_cors_credentials {
        default "";
        "https://www.123proxy.cn" "true";
        "https://123proxy.cn" "true";
    }

    limit_req_zone $binary_remote_addr zone=console_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=console_otp:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=console_ip:10m rate=5r/s;

    include /etc/nginx/conf.d/*.conf;
}
