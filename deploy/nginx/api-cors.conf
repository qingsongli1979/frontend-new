# Normalize CORS at the public edge so upstream services cannot emit
# duplicate or conflicting Access-Control-* response headers.
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Max-Age;

add_header Access-Control-Allow-Origin $console_cors_origin always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "Accept, Accept-Language, Authorization, Content-Type, X-Requested-With" always;
add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length" always;
add_header Access-Control-Allow-Credentials $console_cors_credentials always;
add_header Access-Control-Max-Age "600" always;
add_header Vary "Origin" always;

if ($request_method = OPTIONS) {
    return 204;
}
