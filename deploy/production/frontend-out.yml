version: "3.8"

services:
  http:
    image: registry.cn-hongkong.aliyuncs.com/123proxy/intelligroup-frontend:${RELEASE_TAG}
    environment:
      DEPLOY_TARGET: cn
      TLS_MODE: "on"
      WEBSITE_LISTEN: "443 ssl http2"
      CONSOLE_LISTEN: "443 ssl http2"
      HTTPS_REDIRECT_LISTEN: "80"
      WEBSITE_TLS_CERTIFICATE: /cert/123proxy.cn.pem
      WEBSITE_TLS_CERTIFICATE_KEY: /cert/123proxy.cn.key
      CONSOLE_TLS_CERTIFICATE: /cert/console.123proxy.cn.pem
      CONSOLE_TLS_CERTIFICATE_KEY: /cert/console.123proxy.cn.key
      REAL_IP_HEADER: X-Forwarded-For
      ACCOUNT_SERVICE_UPSTREAM: http://account-service:6000
      AUTH_SERVICE_UPSTREAM: http://auth-service:5000
      IP_SERVICE_UPSTREAM: http://c3-ip-app:6800
      STATUS_API_UPSTREAM: http://192.168.85.105:8080
      LEGACY_CONSOLE_UPSTREAM: http://legacy-console:80
      WORDPRESS_UPSTREAM: http://cloudam-wordpress:80
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /data/cert:/cert:ro
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-file: "10"
        max-size: 10m
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 60s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        monitor: 30s
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
        monitor: 30s
        order: stop-first

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK}
